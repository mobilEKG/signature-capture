<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#0d1711" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Capture a handwritten signature with your camera and download a transparent PNG. Open source, browser only, no account, no image upload." />
    <meta property="og:title" content="Free Signature Background Remover | Transparent PNG Signature" />
    <meta property="og:description" content="Capture a handwritten signature with your camera and download a transparent PNG. Open source, browser only, no account, no image upload." />
    <meta property="og:url" content="https://signature.codeant.studio/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://signature.codeant.studio/icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Free Signature Background Remover | Transparent PNG Signature" />
    <meta name="twitter:description" content="Capture a handwritten signature with your camera and download a transparent PNG. Open source, browser only, no account, no image upload." />
    <meta name="twitter:image" content="https://signature.codeant.studio/icons/icon-512x512.png" />
    <title>Free Signature Background Remover | Transparent PNG Signature</title>
    <link rel="canonical" href="https://signature.codeant.studio/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Signature Capture",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web browser, iOS, Android, Windows, macOS, Linux",
        "offers": {
          "@type": "Offer",
          "price": 0,
          "priceCurrency": "USD"
        },
        "description": "Open source browser app that captures a handwritten signature and exports a transparent PNG without uploading the image."
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
  </head>
  <body class="bg-metal">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then(() =>
              navigator.serviceWorker.ready.then((registration) => {
                if (!navigator.onLine) {
                  registration.active?.postMessage({
                    type: 'SET_FRESH_FETCH',
                    value: false,
                  });
                }

              })
            );
        });
      }
    </script>
  </body>
</html>
