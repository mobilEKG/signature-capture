# CNB CI/CD for Signature Capture.
# Pull requests verify the application without changing the live Worker.
# Main pushes repeat those checks and deploy the built static assets.
# The deployment stage requires protected CNB secrets. It stops before
# deployment when the Cloudflare token or account ID is missing.

main:
  pull_request:
    - name: Verify pull request
      docker:
        # Node 22 is an active LTS line supported by the current Vite toolchain.
        image: node:22-bookworm-slim
        # Reuse npm's download cache without sharing node_modules between jobs.
        volumes:
          - /root/.npm
      stages:
        - name: Install dependencies
          script: |
            set -eu
            npm ci --cache /root/.npm --prefer-offline --no-audit --fund=false
        - name: Run checks
          script: npm run check

  push:
    - name: Verify and deploy main
      docker:
        # Use the same runtime for verification and deployment for repeatability.
        image: node:22-bookworm-slim
        volumes:
          - /root/.npm
      stages:
        - name: Install dependencies
          script: |
            set -eu
            npm ci --cache /root/.npm --prefer-offline --no-audit --fund=false
        - name: Run checks
          script: npm run check
        - name: Verify deployment secrets
          script: |
            set -eu
            # Fail before Wrangler runs so a misconfigured pipeline cannot
            # publish an incomplete or unauthenticated deployment.
            test -n "${CLOUDFLARE_API_TOKEN:-}" || {
              echo "CLOUDFLARE_API_TOKEN is not configured in CNB."
              exit 1
            }
            test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
              echo "CLOUDFLARE_ACCOUNT_ID is not configured in CNB."
              exit 1
            }
        - name: Deploy to Cloudflare Workers
          script: |
            set -eu
            npm run deploy

# Tags are release points. They receive the same verification as main, but do
# not deploy or mutate a release asset because this project ships a hosted app.
$:
  tag_push:
    - name: Verify release tag
      docker:
        image: node:22-bookworm-slim
        volumes:
          - /root/.npm
      stages:
        - name: Install dependencies
          script: |
            set -eu
            npm ci --cache /root/.npm --prefer-offline --no-audit --fund=false
        - name: Run checks
          script: npm run check
